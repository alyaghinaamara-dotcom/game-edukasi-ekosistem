<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petualangan Penjaga Kerajaan Ekosistem</title>
<style>
:root{--ink:#24305a;--muted:#687398;--sky:#c9f0ff;--pink:#ffd0e4;--cream:#fff8e8;--gold:#ffd66f;--mint:#a8f0cf;--lilac:#d8c7ff;--line:#e3e8ff;--shadow:0 18px 45px #222b5b24}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 8% 7%,#ffd9eb 0,transparent 28%),radial-gradient(ellipse at 90% 10%,#c7efff 0,transparent 31%),radial-gradient(ellipse at 50% 100%,#d6f6df 0,transparent 35%),linear-gradient(135deg,#edf0ff 0%,#e9f8ff 48%,#fff3e8 100%);background-attachment:fixed;overflow-x:hidden}
body:before,body:after{content:"✦  ·  ✧     ✦       ·    ✧";position:fixed;z-index:-1;color:#ffffffb8;font-size:clamp(24px,4vw,50px);letter-spacing:18px;pointer-events:none;animation:drift 14s ease-in-out infinite alternate}
body:before{top:9%;left:-2%;transform:rotate(-12deg)}body:after{right:-3%;bottom:12%;transform:rotate(14deg);animation-delay:-5s}
@keyframes drift{from{translate:0 0}to{translate:12px -18px}}
.wrap{max-width:1080px;margin:auto;padding:22px 20px 18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:15px}
.brand{font-weight:1000;letter-spacing:1.2px;font-size:.9rem;color:#51477e;background:#ffffffb8;border:1px solid #fff;border-radius:99px;padding:10px 15px;box-shadow:0 5px 18px #5e6c9b12}
.pill{background:linear-gradient(135deg,#fff,#fff8df);border:1px solid #fff;border-radius:99px;padding:10px 15px;font-size:.92rem;font-weight:900;box-shadow:0 5px 18px #5e6c9b12}
.progress{height:12px;background:#ffffffb8;border:1px solid #fff;border-radius:99px;overflow:hidden;margin:12px 0 22px;padding:2px;box-shadow:inset 0 2px 4px #6271a21a}
.progress span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#91dff4,#a7e9bd,#ffd779,#f6b8d5);width:0;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.card{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(145deg,#fffffffa,#ffffffed);border:2px solid #ffffff;border-radius:32px;padding:clamp(22px,4vw,42px);box-shadow:var(--shadow);max-width:940px;margin:0 auto;backdrop-filter:blur(8px)}
.card:before{content:"";position:absolute;inset:0 0 auto;height:7px;background:linear-gradient(90deg,#8bdcf2,#c6b3ff,#ffbfd8,#ffdc85,#a9edc7);z-index:-1}
.card:after{content:"✧";position:absolute;right:22px;top:15px;font-size:30px;color:#e8c96d;opacity:.7;pointer-events:none}
.hero{text-align:center;background:radial-gradient(ellipse at 50% 0%,#fff9e7 0,transparent 55%),linear-gradient(145deg,#fffafd,#f2fbff 55%,#fff5e7)}
h1{font-size:clamp(2.1rem,6.2vw,4rem);line-height:1.03;letter-spacing:-1.6px;margin:12px 0 18px;color:#30335f;text-shadow:0 3px 0 #fff}
h2{font-size:clamp(1.55rem,4vw,2.45rem);line-height:1.12;letter-spacing:-.7px;margin:10px 0 14px;color:#343963}
h3{margin:8px 0;color:#343963}.sub{font-size:clamp(1rem,2vw,1.12rem);line-height:1.75;max-width:700px;margin:0 auto 20px;color:#596487}
.emoji{font-size:clamp(3.2rem,10vw,6.2rem);line-height:1.25;filter:drop-shadow(0 8px 7px #7773);margin:4px 0 10px;animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-5px) rotate(1deg)}}
.small{font-size:.92rem;color:var(--muted);line-height:1.6}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:24px}
button{font:inherit;cursor:pointer;border:1px solid #fff;border-radius:16px;padding:13px 19px;font-weight:900;color:#34345d;background:linear-gradient(135deg,#ffe9a1,#ffd363);box-shadow:0 5px 0 #d6ac4f,0 9px 20px #d6ac4f24;transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}
button:hover{transform:translateY(-3px);filter:saturate(1.08);box-shadow:0 8px 0 #d6ac4f,0 13px 22px #d6ac4f30}button:active{transform:translateY(2px);box-shadow:0 2px 0 #d6ac4f}button:focus-visible,.map:focus-visible{outline:4px solid #8ddcf2;outline-offset:3px}
button.secondary{background:linear-gradient(135deg,#fff,#f1f4ff);box-shadow:0 5px 0 #c7d0ed,0 8px 18px #8796c01a}button.secondary:hover{box-shadow:0 8px 0 #c7d0ed,0 12px 22px #8796c026}button.pink{background:linear-gradient(135deg,#ffd5e6,#ffb8d5);box-shadow:0 5px 0 #d992b3,0 8px 18px #d992b326}button.green{background:linear-gradient(135deg,#baf5ce,#8fe0b0);box-shadow:0 5px 0 #76bd91}
.section{margin:20px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:15px;margin-top:23px}
.map{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(155deg,#fff 0%,#f6f8ff 58%,#fff7e9 100%);border:2px solid #fff;border-radius:23px;padding:19px 13px;text-align:center;box-shadow:0 6px 0 #d3dcf5,0 12px 20px #6b79a312;cursor:pointer;min-height:166px;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.map:before{content:"";position:absolute;width:110px;height:110px;right:-40px;top:-45px;border-radius:50%;background:#dff7ff;z-index:-1}.map:hover{transform:translateY(-5px) rotate(-.5deg);border-color:#d8e7ff;box-shadow:0 10px 0 #c7d3f2,0 18px 25px #6b79a322}.map.locked{opacity:.58;filter:grayscale(.5);cursor:not-allowed;box-shadow:0 4px 0 #d6dcec}.map .icon{font-size:2.7rem;filter:drop-shadow(0 4px 4px #7277a126)}.map strong{display:block;margin:8px 0 5px;font-size:.9rem;letter-spacing:.8px;color:#7462a5}.map small{display:inline-block;margin-top:8px;color:#657090;font-size:.78rem;line-height:1.4}
.callout{position:relative;background:linear-gradient(135deg,#f1faff,#f8f3ff 62%,#fff8e9);border:1px solid #dce7ff;border-left:5px solid #b9a7f7;padding:17px 19px;border-radius:18px;line-height:1.75;margin:16px 0;color:#4b587e;box-shadow:0 5px 16px #9eabd412}.callout b{color:#373d69}
.answer-box{margin:20px 0;text-align:left;background:linear-gradient(145deg,#fff8e8,#fff4f9);border:2px solid #ffe1b0;border-radius:22px;padding:18px;box-shadow:0 8px 20px #d8b57b1c}.answer-box label{display:block;font-weight:1000;margin-bottom:10px;color:#51477e;font-size:1.05rem}.answer-box textarea{display:block;width:100%;min-height:118px;resize:vertical;border:2px solid #d9dff5;border-radius:15px;padding:14px;font:inherit;line-height:1.6;color:var(--ink);background:#fff;transition:border-color .2s,box-shadow .2s}.answer-box textarea:focus{outline:none;border-color:#8fd8ee;box-shadow:0 0 0 4px #bceefa7a}.answer-note{font-size:.88rem;color:#747b9a;margin-top:9px;line-height:1.5}
.choices{display:grid;gap:13px;margin-top:22px}.choice{background:linear-gradient(100deg,#fff,#f6f8ff);border:2px solid #e0e6f8;box-shadow:0 4px 0 #d3dcf1;text-align:left;padding:16px 18px;border-radius:17px;font-weight:750;line-height:1.55;transition:transform .18s,border-color .18s}.choice:hover{transform:translateX(3px);border-color:#a9dff1;background:linear-gradient(100deg,#f4fcff,#fff7fc)}
.feedback{padding:19px;border-radius:20px;margin-top:18px;line-height:1.7;box-shadow:0 7px 18px #6c7c8c12}.good{background:linear-gradient(135deg,#e7fff0,#f3fff8);border:2px solid #9fe4b5}.bad{background:linear-gradient(135deg,#fff0f4,#fff8f4);border:2px solid #f2b3c8}.tag{display:inline-block;border-radius:99px;background:linear-gradient(135deg,#f0e8ff,#e8f7ff);border:1px solid #fff;padding:8px 13px;font-size:.82rem;letter-spacing:.4px;font-weight:950;margin:4px;color:#66578e;box-shadow:0 3px 10px #7f83bd12}.stars{font-size:1.5rem;letter-spacing:4px}.footer{text-align:center;color:#70799b;font-size:.82rem;margin:22px 0 5px}
@media(max-width:560px){.wrap{padding:13px}.card{border-radius:24px;padding:22px 17px}.top{align-items:flex-start}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.map{padding:15px 9px;min-height:152px}.actions button{width:100%}.brand{font-size:.78rem}.pill{font-size:.82rem}h1{letter-spacing:-.7px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand">✨ KERAJAAN EKOSISTEM</div><div class="pill" id="score">🏅 Reward: 0/6</div></div>
  <div class="progress"><span id="bar"></span></div>
  <main id="app" class="card hero"></main>
  <div class="footer">Game IPAS Kelas 5 SD • Klik tombol untuk menjelajah • Semangat, Penjaga Alam! 🌱</div>
</div>
<script>
const app=document.getElementById('app');let completed=new Set(),rewards=new Set(),visited=new Set(),screen='cover',retryFrom=0;
const maps=[
{id:1,name:'Gerbang Kerajaan',icon:'🏰',theme:'Gerbang Kerajaan Ekosistem',material:'Ekosistem adalah hubungan timbal balik antara makhluk hidup dan lingkungan tempatnya hidup. Contohnya hutan, sawah, kolam, dan kebun. Setiap komponen punya peran dalam menjaga keseimbangan alam.',challenge:'Di sebuah kolam ada ikan, tumbuhan air, batu, air, dan cahaya matahari. Coba temukan komponen yang hidup dan tak hidup. Ingat, semuanya bisa saling memengaruhi.',reward:'⭐ Bintang Alam'},
{id:2,name:'Hutan Biotik',icon:'🌳',theme:'Hutan Biotik yang Kehilangan Warna',material:'Komponen biotik adalah semua makhluk hidup dalam ekosistem, seperti manusia, hewan, tumbuhan, jamur, dan mikroorganisme. Makhluk hidup berinteraksi satu sama lain dan dengan lingkungannya.',challenge:'Amati penghuni hutan: pohon, burung, jamur, batu, dan air. Pohon, burung, serta jamur termasuk biotik karena merupakan makhluk hidup.',reward:'💎 Kristal Kehidupan'},
{id:3,name:'Danau Abiotik',icon:'💧',theme:'Misteri Danau Abiotik',material:'Komponen abiotik adalah unsur tak hidup, misalnya air, udara, tanah, batu, cahaya matahari, dan suhu. Faktor-faktor ini memengaruhi organisme yang dapat hidup di suatu tempat.',challenge:'Jika air danau berkurang, ikan dan tumbuhan air dapat terganggu. Air, batu, dan cahaya matahari adalah contoh komponen abiotik yang mendukung kehidupan.',reward:'🩵 Kristal Air'},
{id:4,name:'Lembah Rantai Makanan',icon:'🐸',theme:'Lembah Rantai Makanan',material:'Rantai makanan menunjukkan hubungan makan dan dimakan serta aliran energi. Produsen membuat makanan sendiri, konsumen memakan organisme lain, dan pengurai membantu menguraikan sisa makhluk hidup. Contoh: rumput → belalang → katak → ular → elang.',challenge:'Susun jejak energi: rumput dimakan belalang, belalang dimakan katak, katak dimakan ular, lalu ular dimakan elang. Panah menunjukkan arah perpindahan energi.',reward:'🛡️ Lencana Penjaga Rantai Makanan'},
{id:5,name:'Istana Keseimbangan',icon:'👑',theme:'Ujian Akhir Kerajaan',material:'Biotik dan abiotik saling berinteraksi. Perubahan lingkungan dapat memengaruhi organisme, dan perubahan jumlah satu organisme bisa berdampak pada organisme lain dalam rantai makanan. Kesimpulan terbaik didukung oleh bukti, bukan sekadar tebakan.',challenge:'Dua tantangan terakhir akan menguji kemampuanmu menganalisis dan mengevaluasi hubungan dalam ekosistem.',reward:'👑 Mahkota Ekosistem'}
];
function updateTop(){document.getElementById('score').textContent=`🏅 Reward: ${rewards.size}/6`;document.getElementById('bar').style.width=(completed.size/5*100)+'%'}
function button(label,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${label}</button>`}
function show(html,hero=false){app.className='card'+(hero?' hero':'');app.innerHTML=html;updateTop();window.scrollTo({top:0,behavior:'smooth'})}
function cover(){screen='cover';show(`<div class="emoji">🏰🌿✨</div><span class="tag">GAME PETUALANGAN IPAS • KELAS 5</span><h1>Petualangan Penjaga<br>Kerajaan Ekosistem</h1><p class="sub">Kerajaan sedang kehilangan keseimbangan! Jelajahi lima wilayah, pecahkan tantangan, kumpulkan reward, dan bantu Raja Flora menyelamatkan alam.</p><div class="stars">⭐ 💎 💧 🛡️ 👑</div><div class="actions">${button('🚀 MULAI PETUALANGAN','world()')}${button('📜 CARA BERMAIN','how()','secondary')}</div>`,true)}
function how(){show(`<div class="emoji">🧚</div><h2>Salam, Penjaga Alam!</h2><p class="sub">Cara bermainnya mudah:</p><div class="callout" style="text-align:left"><b>1.</b> Pilih MAP dan pelajari materinya.<br><b>2.</b> Selesaikan misi pengamatan di setiap wilayah.<br><b>3.</b> Di istana, jawab 2 soal utama dengan teliti.<br><b>4.</b> Jawaban benar memberimu reward. Jika salah, pelajari petunjuk lalu coba lagi.</div><p class="small">Tip: baca semua pilihan sebelum menjawab. Kamu bisa bermain lagi kapan saja.</p><div class="actions">${button('AKU SIAP!','world()')}${button('KEMBALI','cover()','secondary')}</div>`)}
function world(){screen='world';let cards=maps.map((m,i)=>{let unlocked=i===0||completed.has(i);return `<div class="map ${unlocked?'':'locked'}" onclick="${unlocked?`openMap(${i+1})`:'lockedMsg()'}"><div class="icon">${completed.has(i+1)?'✅':m.icon}</div><strong>MAP ${i+1}</strong>${m.name}<br><small>${completed.has(i+1)?'Misi selesai':unlocked?'Klik untuk masuk':'🔒 Selesaikan MAP sebelumnya'}</small></div>`}).join('');show(`<div class="emoji">🗺️</div><h2>Peta Lima Wilayah Kerajaan</h2><p class="sub">Pilih gerbang yang terbuka. Selesaikan misi secara berurutan untuk memulihkan kerajaan!</p><div class="grid">${cards}</div><div class="actions">${button('KEMBALI KE COVER','cover()','secondary')}</div>`)}
function lockedMsg(){show(`<div class="emoji">🔒🐉</div><h2>Gerbang Masih Terkunci</h2><p class="sub">Naga penjaga berkata: selesaikan wilayah sebelumnya dulu, ya!</p><div class="actions">${button('KEMBALI KE PETA','world()')}</div>`)}
function openMap(n){screen='map'+n;visited.add(n);let m=maps[n-1];show(`<div class="emoji">${m.icon}</div><span class="tag">MAP ${n} DARI 5</span><h2>${m.theme}</h2><p class="sub">${n===1?'Raja Flora memanggilmu untuk memulihkan keseimbangan kerajaan.':n===2?'Warna hutan memudar karena penghuni hutan tak dikenali.':'Misi kerajaan menantimu. Amati, berpikir, dan temukan hubungan dalam alam!'}</p><div class="callout">🎯 <b>Misi:</b> ${m.challenge}</div><div class="actions">${button('📖 PELAJARI MATERI',`material(${n})`)}${button('🗺️ PETA KERAJAAN','world()','secondary')}</div>`)}
function material(n){screen='material'+n;let m=maps[n-1];show(`<div class="emoji">📚✨</div><span class="tag">MATERI MAP ${n}</span><h2>${m.theme}</h2><div class="callout">${m.material}</div><div class="callout"><b>💡 Ingat!</b><br>${n===1?'Ekosistem tersusun atas komponen hidup dan tak hidup yang berinteraksi.':n===2?'Biotik = makhluk hidup.':n===3?'Abiotik = unsur tak hidup yang dapat mendukung kehidupan.':n===4?'Arah panah menunjukkan perpindahan energi ke organisme yang memakannya.':'Perubahan satu komponen bisa berdampak pada komponen lain.'}</div><div class="actions">${button('⚔️ MULAI TANTANGAN',`challenge(${n})`)}${button('ULANGI BACA','material('+n+')','secondary')}${button('KEMBALI','openMap('+n+')','secondary')}</div>`)}
function challenge(n){screen='challenge'+n;let m=maps[n-1];let prompts={1:'Tuliskan contoh komponen hidup (biotik) dan tak hidup (abiotik) yang ada di kolam.',2:'Sebutkan tiga komponen biotik yang ditemukan di hutan.',3:'Tuliskan tiga contoh komponen abiotik yang membantu kehidupan di danau.',4:'Susun rantai makanan dari rumput sampai elang dengan tanda panah.',5:'Jika jumlah katak menurun, apa yang mungkin terjadi pada belalang, rumput, dan ular?'};show(`<div class="emoji">${n===1?'🪷':n===2?'🦋':n===3?'💦':n===4?'🌾':'🏆'}</div><span class="tag">TANTANGAN MAP ${n}</span><h2>${n===1?'Amati Kolam Ajaib':n===2?'Pulihkan Warna Hutan':n===3?'Temukan Kekuatan Danau':n===4?'Ikuti Jejak Energi':'Bekal Ujian Akhir'}</h2><p class="sub">${m.challenge}</p><div class="callout">🧠 <b>Misi kamu:</b> ${prompts[n]}</div><div class="answer-box"><label for="missionAnswer">✍️ Kolom Jawaban Misi ${n}</label><textarea id="missionAnswer" placeholder="Ketik jawabanmu di sini..."></textarea><div class="answer-note">Tuliskan jawaban dengan kata-katamu sendiri. Jika belum tepat, kamu bisa memperbaikinya dan mencoba lagi.</div></div><div id="missionFeedback"></div><div class="actions">${button(n===5?'PERIKSA & LANJUT KE SOAL 1':'PERIKSA JAWABAN','submitMission('+n+')')}${button('BUTUH PETUNJUK','material('+n+')','secondary')}${button('KEMBALI KE PETA','world()','secondary')}</div>`)}
function submitMission(n){const field=document.getElementById('missionAnswer');const feedback=document.getElementById('missionFeedback');const raw=field.value.trim();if(!raw){feedback.innerHTML='<div class="feedback bad"><b>Kolom jawaban masih kosong.</b><br>Yuk, tuliskan jawabanmu terlebih dahulu!</div>';field.focus();return}const a=raw.toLowerCase();const checks={1:['biotik','abiotik'],2:['pohon','burung','jamur'],3:['air','batu','cahaya'],4:['rumput','belalang','katak','ular','elang'],5:['belalang','rumput','ular']};const ok=checks[n].every(k=>a.includes(k));if(ok){if(n===5){feedback.innerHTML='<div class="feedback good"><h3>Jawabanmu sudah mencakup poin penting! 🌟</h3><p>Bagus! Kamu sudah menjelaskan dampak perubahan pada rantai makanan. Lanjutkan ke dua soal utama di istana.</p></div>';completed.add(n);rewards.add(n);setTimeout(()=>{if(screen==='challenge5')question1()},900)}else{feedback.innerHTML='<div class="feedback good"><h3>Jawabanmu sudah tepat! 🎉</h3><p>Kamu berhasil menyelesaikan misi ini dan memperoleh reward.</p></div>';setTimeout(()=>{if(screen==='challenge'+n)missionSuccess(n)},900)}}else{const hints={1:'Sertakan kedua istilah: biotik untuk makhluk hidup dan abiotik untuk unsur tak hidup.',2:'Coba sebutkan pohon, burung, dan jamur.',3:'Ingat unsur tak hidup seperti air, batu, dan cahaya matahari.',4:'Urutkan semua: rumput → belalang → katak → ular → elang.',5:'Pikirkan apa yang terjadi pada belalang saat katak berkurang, lalu dampaknya pada rumput dan ular.'};feedback.innerHTML='<div class="feedback bad"><h3>Belum lengkap, Penjaga Alam! 🌱</h3><p>'+hints[n]+'</p><p>Perbaiki jawabanmu di kolom atas, lalu tekan periksa lagi.</p></div>'}}
function missionSuccess(n){completed.add(n);rewards.add(n);screen='reward'+n;show(`<div class="emoji">🎉✨</div><h2>Hebat! Misi Berhasil!</h2><p class="sub">${maps[n-1].challenge}</p><div class="callout"><div class="stars">${maps[n-1].reward}</div><b>Reward berhasil dikumpulkan!</b><br>Tambahkan pencapaian ini ke kartu perjalananmu.</div><div class="actions">${button(n===4?'MENUJU ISTANA':'LANJUT KE MAP '+(n+1),n===4?'openMap(5)':'openMap('+(n+1)+')')}${button('LIHAT PETA','world()','secondary')}</div>`)}
function question1(){screen='q1';show(`<div class="emoji">🌿☀️</div><span class="tag">UJIAN AKHIR • SOAL 1 DARI 2</span><h2>Misteri Taman Kerajaan</h2><p class="sub">Taman kerajaan memiliki rumput, belalang, katak, tanah, air, dan cahaya matahari. Saat kemarau panjang, air berkurang dan banyak rumput mengering.</p><div class="callout"><b>Pertanyaan:</b> Analisislah hubungan komponen biotik dan abiotik. Penjelasan manakah yang paling tepat?</div><div class="choices"><button class="choice" onclick="answer1('A')">A. Air termasuk biotik karena dibutuhkan makhluk hidup.</button><button class="choice" onclick="answer1('B')">B. Berkurangnya air dapat mengganggu pertumbuhan rumput dan memengaruhi organisme yang bergantung padanya.</button><button class="choice" onclick="answer1('C')">C. Rumput termasuk abiotik karena tidak dapat berpindah tempat.</button><button class="choice" onclick="answer1('D')">D. Komponen abiotik tidak memengaruhi kehidupan organisme.</button></div><div class="actions">${button('KEMBALI KE MATERI','material(5)','secondary')}</div>`)}
function answer1(a){if(a==='B'){rewards.add('q1');show(`<div class="emoji">🎉💎</div><div class="feedback good"><h2>Selamat! Jawaban kamu benar</h2><p>Air adalah komponen abiotik yang dibutuhkan rumput untuk tumbuh. Jika rumput mengering, organisme yang memakannya juga dapat terdampak.</p><b>Reward: 💎 Kristal Analisis</b></div><div class="actions">${button('KLAIM REWARD & LANJUT','question2()')}</div>`)}else{show(`<div class="emoji">🧚‍♀️📘</div><div class="feedback bad"><h2>Belum tepat, ayo belajar lagi</h2><p>Ingat: biotik adalah makhluk hidup, sedangkan abiotik adalah unsur tak hidup. Air memang tak hidup, tetapi sangat penting bagi pertumbuhan rumput.</p></div><div class="actions">${button('PELAJARI MATERI','material(5)','secondary')}${button('COBA LAGI','question1()')}</div>`)}}
function question2(){screen='q2';show(`<div class="emoji">🌱🐸🦅</div><span class="tag">UJIAN AKHIR • SOAL 2 DARI 2</span><h2>Selamatkan Rantai Makanan</h2><p class="sub">Di padang rumput, rantai makanannya adalah:<br><b>Rumput → belalang → katak → ular → elang</b><br>Suatu hari, jumlah katak menurun drastis akibat perubahan lingkungan.</p><div class="callout"><b>Pertanyaan:</b> Kesimpulan manakah yang paling masuk akal?</div><div class="choices"><button class="choice" onclick="answer2('A')">A. Belalang pasti punah karena jumlah katak berkurang.</button><button class="choice" onclick="answer2('B')">B. Rumput pasti habis karena elang tidak lagi memakan katak.</button><button class="choice" onclick="answer2('C')">C. Belalang berpotensi meningkat, rumput dapat lebih banyak dimakan, dan ular dapat kekurangan makanan.</button><button class="choice" onclick="answer2('D')">D. Semua organisme tidak akan terpengaruh karena hidup di tempat yang sama.</button></div><div class="actions">${button('ULANGI MATERI','material(4)','secondary')}</div>`)}
function answer2(a){if(a==='C'){rewards.add('q2');completed.add(5);show(`<div class="emoji">👑🌟</div><div class="feedback good"><h2>Selamat! Jawaban kamu benar</h2><p>Jika katak menurun, belalang dapat meningkat karena lebih sedikit dimangsa. Rumput berpotensi lebih banyak dimakan, sedangkan ular bisa kekurangan mangsa. Dampak sebenarnya juga bergantung pada kondisi ekosistem lainnya.</p><b>Reward: 👑 Mahkota Evaluator Ekosistem</b></div><div class="actions">${button('RAYAKAN KEMENANGAN','victory()')}</div>`)}else{show(`<div class="emoji">🐉📚</div><div class="feedback bad"><h2>Belum tepat, ayo belajar lagi</h2><p>Perhatikan arah rantai makanan. Katak memakan belalang, sedangkan ular memakan katak. Perubahan jumlah katak dapat memengaruhi organisme sebelum dan sesudahnya.</p></div><div class="actions">${button('PELAJARI MATERI','material(4)','secondary')}${button('COBA LAGI','question2()')}</div>`)}}
function victory(){screen='victory';rewards.add('final');show(`<div class="emoji">🏰👑🎆</div><span class="tag">MISI SELESAI</span><h1>Kerajaan Ekosistem<br>Kembali Seimbang!</h1><p class="sub">Selamat, Penjaga Alam! Kamu telah menyelesaikan lima wilayah dan dua soal utama. Kamu mampu menganalisis hubungan biotik dan abiotik serta mengevaluasi dampak perubahan rantai makanan.</p><div class="callout"><div class="stars">⭐ 💎 💧 🛡️ 👑</div><b>Gelar baru: Penjaga Kerajaan Ekosistem</b><br>Terus jaga alam di dunia nyata!</div><div class="actions">${button('🔁 MAIN LAGI','restart()')}${button('🗺️ LIHAT PETA','world()','secondary')}${button('💭 REFLEKSI','reflection()','pink')}</div>`)}
function reflection(){show(`<div class="emoji">💭🌱</div><h2>Refleksi Sang Penjaga</h2><div class="callout" style="text-align:left">1. Apa perbedaan komponen biotik dan abiotik?<br><br>2. Bagaimana perubahan satu komponen dapat memengaruhi komponen lain?<br><br>3. Apa yang bisa kamu lakukan untuk menjaga keseimbangan ekosistem?</div><p class="sub">Ceritakan jawabanmu kepada guru atau teman.</p><div class="actions">${button('SELESAI','victory()')}${button('MAIN LAGI','restart()','secondary')}</div>`)}
function restart(){completed.clear();rewards.clear();visited.clear();cover()}
cover();
